name: Publish Idle for Rhythia to GitHub Pages

# The site is served from the gh-pages branch. This copies rhythia-idle/ into the
# rhythia-idle/ folder of that branch and leaves everything else there alone.

on:
  push:
    branches: [master]
    paths:
      - 'rhythia-idle/**'
      - '.github/workflows/rhythia-idle-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rhythia-idle-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: rhythia-idle
          destination_dir: rhythia-idle
          keep_files: true
          commit_message: 'Deploy Idle for Rhythia'
