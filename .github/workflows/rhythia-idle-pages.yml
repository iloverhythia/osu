name: Deploy Idle for Rhythia to GitHub Pages

on:
  push:
    branches: [master, claude/lucid-ramanujan-3tzjab]
    paths:
      - 'rhythia-idle/**'
      - '.github/workflows/rhythia-idle-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rhythia-idle-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (enables it on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload the game folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: rhythia-idle
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
