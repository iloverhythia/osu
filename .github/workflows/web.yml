on:
  push:
    branches: [master]
    paths: ['osu.Web/**', '.github/workflows/web.yml', 'osu.Game*.Tests/Resources/**']
  pull_request:
    paths: ['osu.Web/**', '.github/workflows/web.yml']
  workflow_dispatch:
name: osu!web
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osu.Web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: osu.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Includes reference tests that read lazer's C# test resources from the repository.
      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: osu.Web/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
